server:
  port: 5000

spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  sql:
    init:
      mode: always

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false

s3:
  bucket: shelter-project

api:
  earthquake:
    service-key: ${API_EARTHQUAKE_KEY}
  chemical:
    service-key: ${API_CHEMICAL_KEY}
  heat:
    service-key: ${API_HEAT_KEY}
  cold:
    service-key: ${API_COLD_KEY}
  defense:
    service-key: ${API_DEFENSE_KEY}
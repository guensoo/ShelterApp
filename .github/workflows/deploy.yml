name: Deploy Fullstack App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ 백엔드 빌드 (Java)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give execute permission to gradlew
        working-directory: ./Java/shelter-api
        run: chmod +x ./gradlew

      - name: Build Spring Boot Project
        working-directory: ./Java/shelter-api
        run: ./gradlew clean build
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          API_EARTHQUAKE_KEY: ${{ secrets.API_EARTHQUAKE_KEY }}
          API_CHEMICAL_KEY: ${{ secrets.API_CHEMICAL_KEY }}
          API_HEAT_KEY: ${{ secrets.API_HEAT_KEY }}
          API_COLD_KEY: ${{ secrets.API_COLD_KEY }}
          API_DEFENSE_KEY: ${{ secrets.API_DEFENSE_KEY }}

      # ✅ 프론트엔드 빌드 (React)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Create .env file for React
        working-directory: ./React/react-workspace/shelter-react-app
        run: |
          echo "REACT_APP_NAVER_MAP_CLIENT_ID=${{ secrets.REACT_APP_NAVER_MAP_CLIENT_ID }}" > .env
          echo "REACT_APP_NAVER_MAP_CLIENT_SECRET=${{ secrets.REACT_APP_NAVER_MAP_CLIENT_SECRET }}" >> .env

      - name: Build React App
        working-directory: ./React/react-workspace/shelter-react-app
        run: |
          npm install --legacy-peer-deps
          npm run build

      # ✅ 프론트엔드 S3에 업로드
      - name: Deploy React to S3
        run: |
          aws s3 sync ./React/react-workspace/shelter-react-app/build s3://${{ secrets.AWS_S3_BUCKET }} --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2

      # ✅ EC2에 백엔드 .jar 복사
      - name: Copy .jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "Java/shelter-api/build/libs/*.jar"
          target: "~/app/Java/shelter-api/build/libs"

      # ✅ EC2에 .env 파일 업로드
      - name: Create .env and Upload to EC2
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" > .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> .env
          echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
          echo "API_EARTHQUAKE_KEY=${{ secrets.API_EARTHQUAKE_KEY }}" >> .env
          echo "API_CHEMICAL_KEY=${{ secrets.API_CHEMICAL_KEY }}" >> .env
          echo "API_HEAT_KEY=${{ secrets.API_HEAT_KEY }}" >> .env
          echo "API_COLD_KEY=${{ secrets.API_COLD_KEY }}" >> .env
          echo "API_DEFENSE_KEY=${{ secrets.API_DEFENSE_KEY }}" >> .env
        shell: bash

      - name: Send .env file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ".env"
          target: "~/app/Java/shelter-api/.env"

      # ✅ EC2에서 서버 재시작 + .env 적용
      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          timeout: 1800s
          script: |
            pkill -f 'java -jar' || true
            sleep 10
            cd ~/app/Java/shelter-api
            set -a
            source .env
            set +a
            cd build/libs
            nohup java -jar shelter-api-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > ~/app/log.txt 2>&1 &
            sleep 5
